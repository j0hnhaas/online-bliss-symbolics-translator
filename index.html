<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bliss-Übersetzer · Text in Blissymbole umwandeln</title>
  <meta name="description" content="Wandelt deutschen oder englischen Text in Blissymbole um. Läuft komplett im Browser, mit dem offiziellen BCI-Vokabular (CC BY-SA 4.0).">
  <meta name="theme-color" content="#f6f3ec">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Bliss">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1 data-i18n="title">Bliss-Übersetzer</h1>
      <p class="tagline" data-i18n="tagline">Deutschen oder englischen Text in Blissymbole umwandeln</p>
    </div>
    <div class="ui-lang" role="group" aria-label="Interface language">
      <button type="button" data-ui="de">DE</button>
      <button type="button" data-ui="en">EN</button>
    </div>
  </header>

  <main>
    <section class="panel" aria-labelledby="in-h">
      <h2 id="in-h" class="sr-only" data-i18n="inputHeading">Eingabe</h2>
      <label for="text" class="label" data-i18n="inputLabel">Dein Text</label>
      <textarea id="text" rows="4" spellcheck="false" autocomplete="off" data-i18n-ph="placeholder" placeholder="Schreibe hier einen Text …"></textarea>

      <div class="controls">
        <div class="seg" role="radiogroup" aria-label="Sprache des Textes" id="lang-seg">
          <button type="button" role="radio" data-lang="auto" aria-checked="true" data-i18n="langAuto">Auto</button>
          <button type="button" role="radio" data-lang="de" aria-checked="false">Deutsch</button>
          <button type="button" role="radio" data-lang="en" aria-checked="false">English</button>
        </div>
        <label class="more-lang"><span class="sr-only" data-i18n="moreLangs">Weitere Sprachen</span>
          <select id="lang-more"></select>
        </label>
        <label class="check"><input type="checkbox" id="opt-captions" checked> <span data-i18n="optCaptions">Wörter darunter</span></label>
        <label class="check"><input type="checkbox" id="opt-articles" checked> <span data-i18n="optArticles">Artikel weglassen</span></label>
        <label class="check"><input type="checkbox" id="opt-grammar" checked> <span data-i18n="optGrammar">Zeit &amp; Plural</span></label>
        <label class="size"><span data-i18n="optSize">Größe</span> <input type="range" id="size" min="40" max="140" step="2" value="64"></label>
      </div>

      <div class="examples">
        <span class="label small" data-i18n="examples">Beispiele</span>
        <span id="example-chips"></span>
      </div>
    </section>

    <section class="panel output" aria-labelledby="out-h">
      <div class="out-head">
        <h2 id="out-h" class="label" data-i18n="outputLabel">Blissymbole</h2>
        <div class="actions">
          <button type="button" id="btn-png" data-i18n="btnPng">PNG</button>
          <button type="button" id="btn-svg" data-i18n="btnSvg">SVG</button>
          <button type="button" id="btn-print" data-i18n="btnPrint">Drucken</button>
          <button type="button" id="btn-link" data-i18n="btnLink">Link kopieren</button>
        </div>
      </div>
      <div id="out" class="canvas" aria-live="polite"><p class="muted" data-i18n="loading">Lade Vokabular …</p></div>
      <p id="status" class="status"></p>
      <p class="hint" data-i18n="hint">Tipp: Auf ein Symbol klicken, um eine andere Bedeutung zu wählen.</p>
    </section>
  </main>

  <div id="pop" class="pop" role="dialog" aria-modal="false" hidden></div>

  <footer>
    <p data-i18n-html="footerLicense"></p>
    <p data-i18n-html="footerNote"></p>
    <p id="privacy" class="muted" hidden data-i18n="privacy"></p>
    <div class="pwa" id="pwa">
      <button type="button" id="btn-install" hidden data-i18n="btnInstall">App installieren</button>
      <button type="button" id="btn-offline" hidden data-i18n="btnOffline">Alle Symbole offline laden</button>
      <span id="pwa-status" class="muted" role="status"></span>
    </div>
    <p id="ios-hint" class="muted" hidden data-i18n="iosHint"></p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
